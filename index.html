<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SST — Prévention et Secours</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007a4d">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SST">
<style>
  :root{
    --orange:#e8791a; --orange-dark:#c9640f;
    --green:#007a4d; --green-dark:#00623d; --green-light:#e6f4ee;
    --bg:#f6f7f8; --panel:#ffffff; --border:#e3e6e9;
    --text:#1c2226; --text-muted:#5c6670; --danger:#d1461f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); overscroll-behavior-y:none;
  }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; }
  header.topbar{
    position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--border);
    padding:10px 14px; display:flex; align-items:center; gap:10px; padding-top:max(10px, env(safe-area-inset-top));
  }
  .backbtn{
    border:none; background:var(--bg); width:36px; height:36px; border-radius:50%; font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex:0 0 auto;
  }
  .topbar h2{ font-size:16px; margin:0; font-weight:600; flex:1; }
  main{ flex:1; padding:14px 14px 32px; }
  .search-wrap{ padding:0 0 12px; }
  .search-wrap input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    font-size:15px; background:var(--panel);
  }
  .search-results{ margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .search-hit{
    padding:10px 12px; background:var(--panel); border:1px solid var(--border); border-radius:10px;
    font-size:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  .hero{
    background:linear-gradient(135deg, var(--green), var(--green-dark)); color:#fff; border-radius:16px;
    padding:20px; margin-bottom:16px;
  }
  .hero h1{ font-size:20px; margin:0 0 4px; font-weight:700; }
  .hero p{ margin:0; font-size:13px; opacity:.9; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 14px;
    cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:8px;
  }
  .card .label{ font-weight:700; font-size:15px; }
  .card .sub{ font-size:12px; color:var(--text-muted); }
  .card.orange{ border-top:4px solid var(--orange); }
  .card.green{ border-top:4px solid var(--green); }
  .urgence-btn{
    width:100%; background:var(--danger); color:#fff; border:none; border-radius:14px; padding:14px 16px;
    font-size:16px; font-weight:700; display:flex; align-items:center; gap:12px; cursor:pointer; margin-bottom:16px;
  }
  .urgence-btn .arrow{ margin-left:auto; opacity:.85; }
  .urgence-btn .pic-square{ background:transparent; border:none; }
  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin:18px 0 8px; font-weight:700; }
  .pic-square{
    width:52px; height:52px; border-radius:8px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden; border:1px solid var(--border);
  }
  .pic-square img{ width:100%; height:100%; object-fit:contain; }
  .pic-hero{
    width:104px; height:104px; margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden;
  }
  .pic-hero img{ width:100%; height:100%; object-fit:contain; }
  .pic-inline{ width:58px; height:58px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .pic-inline img{ width:100%; height:100%; object-fit:contain; }
  .mini-row{ display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 16px; }
  .mini-item{ display:flex; flex-direction:column; align-items:center; gap:4px; width:78px; text-align:center; }
  .mini-item .pic-square{ width:64px; height:64px; }
  .mini-item span{ font-size:11px; color:var(--text-muted); line-height:1.2; }
  .list-item{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px;
    margin-bottom:10px; cursor:pointer; display:flex; align-items:center; gap:12px;
  }
  .list-item .txt{ flex:1; }
  .list-item .txt .t{ font-weight:600; font-size:14.5px; }
  .list-item .txt .s{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .list-item .chev{ color:var(--text-muted); }
  .result-banner{
    background:#fdf1e6; border-left:4px solid var(--orange); border-radius:8px; padding:10px 12px; margin:12px 0;
  }
  .result-banner .k{ font-size:11px; text-transform:uppercase; color:var(--orange-dark); font-weight:700; letter-spacing:.03em; }
  .result-banner .v{ font-size:15px; font-weight:700; margin-top:2px; }
  h3.blocktitle{
    background:#161616; color:#fff; display:inline-block; padding:4px 10px; border-radius:4px;
    font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; margin:16px 0 8px;
  }
  h4.subtitle{ font-size:14px; margin:14px 0 4px; font-weight:700; }
  ul.action-list{ margin:6px 0; padding-left:20px; font-size:14.5px; line-height:1.6; }
  ul.action-list ul{ margin:4px 0; }
  .note{ font-size:13.5px; color:var(--orange-dark); background:#fdf1e6; padding:10px 12px; border-radius:8px; margin:12px 0; }
  .body-text{ font-size:15px; line-height:1.65; }
  .body-text p{ margin:0 0 12px; }
  .quote{ background:var(--green-light); color:var(--green-dark); font-weight:600; font-size:15px; padding:14px; border-radius:10px; margin:14px 0; font-style:italic; }
  .flow{ display:flex; flex-direction:column; gap:8px; margin:14px 0; }
  .flow .fstep{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .flow .fstep .pic-square{ width:40px; height:40px; }
  .flow .arrowdown{ text-align:center; color:var(--text-muted); font-size:13px; }
  .action-with-pic{ display:flex; align-items:flex-start; gap:12px; margin:10px 0 16px; }
  .action-with-pic .pic-inline{ margin-top:0; }
  footer.foot{ text-align:center; font-size:11.5px; color:var(--text-muted); padding:20px 14px 30px; }
</style>
</head>

const DATA = {
  prevention: [
    { id:'p1', title:'Être acteur de la prévention', icon:'prevention1',
      html:`<div class="body-text"><p><strong>En tant que sauveteur secouriste du travail (SST)</strong>, vous contribuez à la prévention des risques professionnels dans l'entreprise, en :</p></div>
      <ul class="action-list">
        <li><strong>repérant</strong> les situations dangereuses et en <strong>identifiant</strong> les dangers pouvant entraîner une atteinte à la santé, ainsi que les personnes y étant exposées ;</li>
        <li><strong>supprimant ou faisant supprimer</strong> les dangers dans la limite de votre champ de compétences, de votre autonomie et dans le respect de l'organisation de l'entreprise et des procédures spécifiques fixées en matière de prévention ;</li>
        <li><strong>relayant</strong> aux personnes concernées les informations liées aux situations dangereuses repérées.</li>
      </ul>
      <div class="body-text"><p>Ces actions permettront de supprimer ou de réduire les risques professionnels auxquels vous ou vos collègues pourraient être exposés.</p></div>` },
    { id:'p2', title:"De l'observation à la remontée d'informations", icon:'observer',
      html:`<div class="action-with-pic">${pic('observer','pic-inline')}<div class="body-text"><p><strong>Observer</strong> les situations de travail pour en repérer les situations dangereuses.</p>
      <p>Une situation professionnelle est dangereuse lorsqu'un ou plusieurs individus sont exposés à un ou plusieurs dangers pouvant entraîner un accident ou une maladie.</p></div></div>
      <div class="action-with-pic">${pic('informer','pic-inline')}<div class="body-text"><p><strong>Informer</strong> les personnes exposées au(x) danger(s) et faire remonter à celles en charge de la prévention des risques les situations dangereuses.</p></div></div>` },
    { id:'p3', title:'Supprimer / réduire le danger', icon:'danger_cross',
      html:`<h4 class="subtitle">Contribuer à la suppression du danger</h4>
      <div class="body-text"><p>Si vous repérez une situation dangereuse, la solution à privilégier est de supprimer le danger identifié, par votre action ou celle d'un tiers, s'il est possible d'agir directement.</p></div>
      <div class="quote">Toute situation dangereuse repérée doit faire l'objet d'une remontée d'informations</div>
      <h4 class="subtitle">Contribuer à la réduction du risque</h4>
      <div class="body-text"><p>Si le danger ne peut pas être supprimé, vous pouvez contribuer à réduire le risque en proposant des pistes d'amélioration en matière de prévention.</p></div>
      <h3 class="blocktitle">Actions complémentaires</h3>
      <div class="body-text"><p>Lorsque les mesures de prévention ne sont pas suffisantes, des mesures de protection doivent être mises en place en privilégiant les protections collectives aux protections individuelles.</p></div>` }
  ],

  secoursIntro: `<div class="body-text"><p>En tant que SST, vous intervenez sur votre lieu de travail pour porter les premiers secours à toute victime d'un accident dans les limites de votre champ d'intervention :</p></div>
    <ul class="action-list">
      <li>le plus tôt possible et jusqu'à la prise en charge de la victime par les secours (internes ou externes) ;</li>
      <li>sous la responsabilité de l'employeur au sein de l'entreprise ;</li>
      <li>avec les moyens mis en place par l'employeur et/ou le médecin du travail.</li>
    </ul>
    <div class="body-text"><p>Vous pouvez également être amené à intervenir en dehors de votre lieu de travail afin de porter assistance à une personne en péril.</p></div>`,

  steps: [
    { id:'proteger', num:1, title:'Protéger', icon:'danger',
      html:`<div class="body-text"><p>C'est agir, sans risque pour sa propre sécurité, afin d'éviter un sur-accident, lorsque la victime et toute autre personne sont exposées à un danger persistant.</p></div>
      <h4 class="subtitle">Identifier le(s) danger(s) persistant(s)</h4>
      <div class="mini-row">
        ${mini('mecanique','Mécanique')}
        ${mini('electrique','Électrique')}
        ${mini('thermique','Thermique / incendie')}
        ${mini('toxique','Atmosphère toxique')}
      </div>
      <div class="flow">
        <div class="fstep">${pic('supprimer')}Peut-on les supprimer de façon permanente et sans risque ?</div>
        <div class="arrowdown">↓ Si oui : le faire ou le faire faire</div>
        <div class="fstep">${pic('isoler')}Sinon, peut-on isoler la zone dangereuse de façon permanente et sans risque ?</div>
        <div class="arrowdown">↓ Si oui : le faire ou le faire faire</div>
        <div class="fstep">${pic('danger_cross')}Interdire l'accès à la zone dangereuse.</div>
      </div>
      <h3 class="blocktitle">Actions complémentaires</h3>
      <div class="action-with-pic">${pic('degagement','pic-inline')}<div class="body-text"><p>Si le danger persistant est réel, immédiat, non contrôlable et menace la vie de la victime : effectuer une manœuvre exceptionnelle de dégagement d'urgence.</p></div></div>` },
    { id:'examiner', num:2, title:'Examiner', icon:'examiner',
      html:`<div class="body-text"><p>C'est rechercher les signes qui indiquent que la vie de la victime est menacée.</p></div>
      <ul class="action-list">
        <li>La victime saigne-t-elle abondamment ?</li>
        <li>La victime s'étouffe-t-elle ?</li>
        <li>La victime répond-elle aux questions ? Se plaint-elle ?</li>
        <li>La victime, si elle ne répond pas, respire-t-elle ?</li>
      </ul>
      <div class="note">Dans le cas où la victime est sur le ventre, la mettre sur le dos.</div>` },
    { id:'alerter', num:3, title:'Faire alerter', icon:'alerter',
      html:`<div class="body-text"><p>C'est transmettre les informations nécessaires et suffisantes pour que les secours puissent organiser leur intervention. L'alerte doit être la plus précoce possible.</p></div>
      <h4 class="subtitle">Qui ?</h4>
      <div class="body-text"><p>Les secours et les personnes prévues dans l'organisation des secours de l'entreprise.</p></div>
      <div class="note">Le 114 est le numéro d'appel pour les sourds et malentendants.</div>
      <h4 class="subtitle">Comment ?</h4>
      <div class="body-text"><p>Choisir, si possible, la personne la plus apte pour faire alerter les secours.</p></div>
      <h4 class="subtitle">Préciser dans le message d'alerte</h4>
      <ul class="action-list">
        <li>Le lieu de l'accident (adresse, atelier, étage…).</li>
        <li>La nature de l'accident (chute de hauteur, chariot renversé…).</li>
        <li>Le nombre de victimes.</li>
        <li>L'état de la (des) victime(s).</li>
        <li>Les actions déjà engagées.</li>
      </ul>
      <div class="note">Ne jamais raccrocher le premier.</div>
      <h3 class="blocktitle">Actions complémentaires</h3>
      <ul class="action-list">
        <li>S'assurer que l'alerte a bien été donnée.</li>
        <li>Envoyer une personne au-devant des secours et organiser leur accès sur le lieu de l'accident au plus près de la victime.</li>
      </ul>` }
  ],

  secourir: [
    { id:'saigne', icon:'saigne', actionIcon:'saigne_action', title:'La victime saigne abondamment', keywords:'sang hemorragie garrot pansement',
      resultat:"Arrêter le saignement",
      principales:`<ul class="action-list">
        <li>Faire comprimer ou comprimer l'endroit qui saigne avec la paume de la main (protégée si possible).</li>
        <li>Allonger la victime.</li>
        <li>Si compression manuelle inefficace : garrot.</li>
        <li>Si compression manuelle efficace : pansement compressif si besoin.
          <ul><li>si le saignement reprend : compression manuelle sur le pansement compressif ;</li><li>si le saignement se poursuit : garrot.</li></ul>
        </li></ul>`,
      cas:`<h4 class="subtitle">Cas particuliers</h4>
      <ul class="action-list">
        <li><strong>Saignement de nez</strong> : demander à la victime de s'asseoir, tête penchée en avant ; la faire moucher, puis lui demander de se comprimer les narines pendant 10 minutes.</li>

      </ul>`,
      complementaires:`<ul class="action-list"><li>Surveiller l'efficacité de la technique utilisée.</li><li>Couvrir la victime (si un garrot est posé, le laisser visible).</li><li>Réconforter.</li></ul>` },
    { id:'etouffe', icon:'etouffe', actionIcon:'etouffe_action', title:"La victime s'étouffe", keywords:'obstruction heimlich claques dos avale',
      resultat:"Lui permettre de respirer",
      principales:`<h4 class="subtitle">Obstruction complète</h4>
      <div class="body-text"><p style="font-size:13.5px;color:var(--text-muted)">(la victime ne peut plus parler, tousser ou émettre un son, garde la bouche ouverte...)</p></div>
      <ul class="action-list"><li>Donner de 1 à 5 claques dans le dos.</li><li>Si inefficace :
        <ul><li>adulte, grand enfant : compressions abdominales (méthode de Heimlich) ;</li><li>femme enceinte, personne obèse : compressions thoraciques ;</li><li>nourrisson tenant sur l'avant-bras du SST : compressions thoraciques avec deux doigts au milieu de la poitrine.</li></ul></li></ul>
      <h4 class="subtitle">Obstruction partielle</h4>
      <div class="body-text"><p style="font-size:13.5px;color:var(--text-muted)">(la victime peut parler, tousser et respirer même avec un bruit surajouté)</p></div>
      <ul class="action-list"><li>Mettre la victime dans la position où elle se sent le mieux.</li><li>L'encourager à tousser.</li><li>Suivre les conseils donnés par les secours.</li></ul>`,
      complementaires:`<ul class="action-list"><li>Mettre la victime dans la position dans laquelle elle se sent le mieux.</li><li>Couvrir et surveiller son état.</li><li>Réconforter.</li><li>Suivre les conseils donnés par les secours.</li></ul>` },
    { id:'rcp', icon:'rcp', actionIcon:'rcp_action', title:'Ne répond pas, ne respire pas', keywords:'arret cardiaque rcp massage defibrillateur dae reanimation',
      resultat:"Rétablir artificiellement une respiration et une circulation sanguine efficaces",
      principales:`<h4 class="subtitle">Chez l'adulte</h4>
      <ul class="action-list"><li>Comprimer le thorax (30 compressions) en respectant un rythme de 100 à 120 par minute.</li><li>Souffler de l'air dans les poumons (2 insufflations).</li><li>Répéter des cycles de 30 compressions et 2 insufflations.</li><li>Mettre en œuvre le plus tôt possible le défibrillateur (DAE) en demandant, le cas échéant, à un témoin de le rapporter.</li></ul>
      <h4 class="subtitle">Chez l'enfant et le nourrisson</h4>
      <div class="body-text"><p>Même conduite à tenir que chez l'adulte, mais il convient de :</p></div>
      <ul class="action-list"><li>Débuter par 5 insufflations.</li><li>Répéter des cycles de 15 compressions et 2 insufflations.</li></ul>
      <div class="note">Poursuivre la réanimation jusqu'à l'arrivée des secours.</div>`,
      complementaires:`<ul class="action-list"><li>Surveiller l'efficacité de la (des) technique(s) utilisée(s).</li><li>Pratiquer, si possible, la RCP à 2 SST. Se relayer toutes les 2 minutes en interrompant le moins possible les compressions thoraciques.</li><li>Si les insufflations ne peuvent pas être effectuées, réaliser uniquement les compressions thoraciques en continu.</li></ul>` },
    { id:'pls', icon:'pls', actionIcon:'pls_action', title:'Ne répond pas, mais respire', keywords:'pls position laterale securite inconscient',
      resultat:"Lui permettre de continuer à respirer",
      principales:`<ul class="action-list"><li>Allonger la victime sur le dos.</li><li>Libérer les voies respiratoires.</li><li>Si son état résulte d'un évènement <strong>non traumatique</strong>, mettre la victime sur le côté (position latérale de sécurité – PLS).</li><li>Si son état résulte d'un évènement <strong>traumatique</strong> ou d'un évènement dont on ne connaît pas l'origine : laisser la victime sur le dos et maintenir la liberté des voies aériennes.</li></ul>`,
      complementaires:`<ul class="action-list"><li>Couvrir.</li><li>Surveiller en permanence sa respiration.</li></ul>` },
    { id:'malaise', icon:'malaise', actionIcon:'malaise_action', title:'La victime se plaint de malaise', keywords:'malaise avc vagal chaleur infarctus',
      resultat:"Éviter l'aggravation et prendre un avis médical",
      principales:`<ul class="action-list"><li>Observer les signes du malaise, en particulier les signes d'accident vasculaire cérébral (AVC), d'accident cardiaque ou de maladie infectieuse.</li><li>Mettre la victime au repos.</li><li>Écouter, questionner la victime et/ou son entourage.</li><li>Suivre les conseils donnés par les secours.</li></ul>`,
      cas:`<h4 class="subtitle">Cas particuliers</h4>
      <ul class="action-list"><li>Si la victime reconnaît les signes d'un <strong>malaise vagal</strong> dont elle a l'habitude, et s'il est impossible de l'allonger, l'inviter à réaliser une des manœuvres suivantes pour éviter une perte de connaissance, en agissant sur la circulation :
        <ul><li>se placer en position accroupie et baisser la tête ;</li><li>ou croiser les membres inférieurs et contracter les muscles ;</li><li>ou agripper les deux mains par les doigts en crochet et écarter les coudes.</li></ul></li>
      <li>Si le malaise est provoqué par la <strong>chaleur</strong> :
        <ul><li>installer la victime dans un endroit frais et aéré ;</li><li>la rafraîchir et lui faire boire de l'eau fraîche par petites quantités si elle est consciente et capable de boire.</li></ul></li></ul>`,
      complementaires:`<ul class="action-list"><li>Aider, à sa demande, la victime à prendre un médicament ou du sucre.</li><li>Réconforter et surveiller.</li></ul>` },
    { id:'brulure', icon:'brulure', actionIcon:'brulure_action', title:'La victime se plaint de brûlures', keywords:'brulure thermique chimique electrique eau',
      resultat:"Éviter l'aggravation de la brûlure",
      principales:`<ul class="action-list"><li>Si la brûlure est d'origine <strong>thermique ou électrique</strong> :
        <ul><li>arroser immédiatement la zone brûlée à l'eau courante tempérée pendant au moins 10 minutes (idéalement 20 minutes) ;</li><li>en parallèle, retirer les vêtements s'ils n'adhèrent pas à la peau.</li></ul></li>
      <li>Si la brûlure est d'origine <strong>chimique</strong> :
        <ul><li>rincer immédiatement la zone brûlée à l'eau courante tempérée pour éliminer le produit ;</li><li>éviter que l'eau de ruissellement ne contamine des zones saines (œil, peau…) de la victime ;</li><li>parallèlement, ôter les vêtements imbibés de produit en se protégeant.</li></ul></li></ul>`,
      cas:`<h4 class="subtitle">Cas particuliers — ingestion ou inhalation de produits caustiques ou corrosifs</h4>
      <ul class="action-list"><li>Ne pas faire vomir ou boire.</li><li>Placer la victime en position assise en cas de difficultés respiratoires.</li></ul>`,
      complementaires:`<ul class="action-list"><li>Faire allonger ou placer en position assise en cas de difficultés respiratoires.</li><li>En cas de brûlure avec un produit chimique, consulter et conserver les informations de la fiche de données de sécurité du produit.</li><li>Couvrir.</li><li>Réconforter et surveiller.</li></ul>` },
    { id:'trauma', icon:'trauma', actionIcon:'trauma_action', title:'Douleur / mouvement empêché', keywords:'traumatisme fracture cou rachis membre chute',
      resultat:"Éviter l'aggravation du traumatisme supposé",
      principales:`<h4 class="subtitle">Douleur au cou à la suite d'un traumatisme</h4>
      <ul class="action-list"><li>Demander à la victime de ne pas bouger la tête.</li><li>Éviter toute manipulation intempestive.</li><li>Stabiliser si possible le rachis cervical, dans la position où il se trouve, en maintenant la tête à deux mains.</li></ul>
      <h4 class="subtitle">Traumatisme d'un membre</h4>
      <ul class="action-list"><li>Demander à la victime de ne pas bouger la partie atteinte.</li><li>Éviter toute manipulation intempestive.</li><li>Respecter la position prise par la victime.</li></ul>`,
      complementaires:`<ul class="action-list"><li>Couvrir.</li><li>Réconforter et surveiller.</li></ul>` },
    { id:'plaie', icon:'plaie', actionIcon:'plaie_action', title:'Plaie qui ne saigne pas abondamment', keywords:'plaie coupure blessure section membre',
      resultat:"Éviter l'aggravation de la plaie",
      principales:`<h4 class="subtitle">Pour une plaie grave</h4>
      <ul class="action-list"><li>Installer la victime en position :
        <ul><li>plaie du thorax : assise, en laissant la plaie à l'air libre ;</li><li>plaie de l'abdomen : à plat dos, jambes fléchies ;</li><li>plaie de l'œil : allongée, les deux yeux fermés et si possible en maintenant sa tête à deux mains.</li></ul></li>
      <li>Ne pas retirer les corps étrangers éventuellement présents dans la plaie.</li>
      <li>Dans le cas d'une section de membre, protéger le moignon (champ stérile, compresses ou linge propre) et isoler le segment sectionné dans un sac placé dans un contenant réfrigéré permettant le transport.</li></ul>
      <h4 class="subtitle">Pour une plaie simple</h4>
      <ul class="action-list"><li>Nettoyer et protéger la plaie.</li></ul>`,
      complementaires:`<ul class="action-list"><li>Lui demander de :
        <ul><li>s'assurer que sa vaccination antitétanique est à jour ;</li><li>consulter un médecin en cas d'apparition, dans les jours qui suivent, de fièvre, d'une zone chaude, rouge, gonflée ou douloureuse.</li></ul></li></ul>` }
  ],

  verifStandard: "Vérifier, par observation, l'atteinte et la persistance du résultat attendu, jusqu'à la prise en charge de la victime par les secours."
};

const app = document.getElementById('app');
function go(hash){ location.hash = hash; }

function topbar(title, back){
  return `<header class="topbar">
    ${back !== false ? `<button class="backbtn" onclick="history.back()">←</button>` : `<span style="width:36px"></span>`}
    <h2>${title}</h2>
  </header>`;
}

function render(){
  const hash = location.hash.slice(1) || 'home';
  const [route, id] = hash.split('/');
  if (route === 'home') return renderHome();
  if (route === 'prevention') return id ? renderPreventionDetail(id) : renderPrevention();
  if (route === 'secours') return renderSecours();
  if (route === 'step') return renderStep(id);
  if (route === 'secourir') return renderSecourirList();
  if (route === 'scenario') return renderScenario(id);
  if (route === 'plan') return renderPlan();
  if (route === 'apropos') return renderApropos();
  renderHome();
}

function renderHome(){
  app.innerHTML = `
    ${topbar('SST Aide-mémoire', false)}
    <main>
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Rechercher un symptôme (ex : brulure, saigne...)">
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="hero">
        <h1>Prévention et secours</h1>
        <p>Aide-mémoire du sauveteur secouriste du travail — consultable hors ligne</p>
      </div>
      <button class="urgence-btn" onclick="go('secourir')">
        ${pic('rcp','pic-square')}
        Situation d'urgence — je dois secourir <span class="arrow">→</span>
      </button>
      <div class="grid2">
        <button class="card orange" onclick="go('prevention')">
          ${pic('prevention1')}
          <div class="label">Prévention</div>
          <div class="sub">Repérer, supprimer, informer</div>
        </button>
        <button class="card green" onclick="go('secours')">
          ${pic('secours_intro')}
          <div class="label">Secours</div>
          <div class="sub">Protéger · Examiner · Alerter · Secourir</div>
        </button>
      </div>
      <div class="list-item" onclick="go('plan')">
        ${pic('danger')}
        <div class="txt"><div class="t">Plan d'intervention SST</div><div class="s">Moins de 3 minutes pour agir</div></div>
        <div class="chev">›</div>
      </div>
      <div class="list-item" onclick="go('apropos')">
        ${pic('prevention1')}
        <div class="txt"><div class="t">À propos de ce document</div><div class="s">Certification, renouvellement, édition INRS</div></div>
        <div class="chev">›</div>
      </div>
    </main>
    <footer class="foot">Pictogrammes et contenu d'après l'aide-mémoire SST — INRS ED 4085 (6ᵉ édition, 2024, révisée 2026)</footer>
  `;
  document.getElementById('searchInput').addEventListener('input', onSearch);
}

function normalize(str){ return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function onSearch(e){
  const q = normalize(e.target.value.trim());
  const box = document.getElementById('searchResults');
  if (!q){ box.innerHTML=''; return; }
  const hits = DATA.secourir.filter(s => normalize(s.title+' '+s.keywords).includes(q));
  box.innerHTML = hits.map(s => `<div class="search-hit" onclick="go('scenario/${s.id}')"><span>${s.title}</span><span>›</span></div>`).join('') || `<div class="search-hit" style="cursor:default;color:var(--text-muted)">Aucun résultat</div>`;
}

function renderPrevention(){
  app.innerHTML = `${topbar('Prévention')}<main>
    ${DATA.prevention.map(p => `
      <div class="list-item" onclick="go('prevention/${p.id}')">
        ${pic(p.icon)}
        <div class="txt"><div class="t">${p.title}</div></div>
        <div class="chev">›</div>
      </div>`).join('')}
  </main>`;
}

function renderPreventionDetail(id){
  const p = DATA.prevention.find(x=>x.id===id);
  app.innerHTML = `${topbar(p.title)}<main>${pic(p.icon,'pic-hero')}${p.html}</main>`;
}

function renderSecours(){
  app.innerHTML = `${topbar('Secours')}<main>
    <div class="body-text">${DATA.secoursIntro}</div>
    <div class="section-title">Les 4 étapes</div>
    ${DATA.steps.map(s => `
      <div class="list-item" onclick="go('step/${s.id}')">
        ${pic(s.icon)}
        <div class="txt"><div class="t">${s.num}. ${s.title}</div></div>
        <div class="chev">›</div>
      </div>`).join('')}
    <div class="list-item" onclick="go('secourir')" style="border-color:var(--green)">
      ${pic('rcp')}
      <div class="txt"><div class="t">4. Secourir — choisir un symptôme</div></div>
      <div class="chev">›</div>
    </div>
  </main>`;
}

function renderStep(id){
  const s = DATA.steps.find(x=>x.id===id);
  app.innerHTML = `${topbar(s.title)}<main>${pic(s.icon,'pic-hero')}${s.html}</main>`;
}

function renderSecourirList(){
  app.innerHTML = `${topbar('Secourir — choisir un symptôme')}<main>
    <div class="note">Sélectionnez la situation qui correspond à ce que vous observez.</div>
    ${DATA.secourir.map(s => `
      <div class="list-item" onclick="go('scenario/${s.id}')">
        ${pic(s.icon)}
        <div class="txt"><div class="t">${s.title}</div></div>
        <div class="chev">›</div>
      </div>`).join('')}
  </main>`;
}

function renderScenario(id){
  const s = DATA.secourir.find(x=>x.id===id);
  app.innerHTML = `${topbar(s.title)}<main>
    ${pic(s.icon,'pic-hero')}
    <div class="result-banner"><div class="k">Résultat à atteindre</div><div class="v">${s.resultat}</div></div>
    <h3 class="blocktitle">Actions principales</h3>
    <div class="action-with-pic">${pic(s.actionIcon,'pic-inline')}<div style="flex:1">${s.principales}</div></div>
    ${s.cas || ''}
    <div class="note">${DATA.verifStandard}</div>
    <h3 class="blocktitle">Actions complémentaires</h3>
    ${s.complementaires}
  </main>`;
}

function renderPlan(){
  app.innerHTML = `${topbar("Plan d'intervention SST")}<main>
    <div class="result-banner"><div class="k">À retenir</div><div class="v">Moins de trois minutes pour agir</div></div>
    <div class="flow">
      <div class="fstep" onclick="go('step/proteger')">${pic('danger')}Protéger</div>
      <div class="arrowdown">↓</div>
      <div class="fstep" onclick="go('step/examiner')">${pic('examiner')}Examiner</div>
      <div class="arrowdown">↓</div>
      <div class="fstep" onclick="go('step/alerter')">${pic('alerter')}Faire alerter</div>
      <div class="arrowdown">↓</div>
      <div class="fstep" onclick="go('secourir')">${pic('rcp')}Secourir</div>
    </div>
    <div class="note">En période d'épidémie (telle que la Covid-19), le SST doit se protéger et adapter la conduite à tenir, notamment en respectant les consignes sanitaires nationales, les consignes de secours applicables dans l'entreprise, ainsi que, le cas échéant, les recommandations spécifiques de l'INRS.</div>
  </main>`;
}

function renderApropos(){
  app.innerHTML = `${topbar('À propos')}<main>
    <div class="body-text"><p>Vous êtes certifié sauveteur secouriste du travail (SST). Au cours de votre formation, vous avez acquis des compétences qui vous permettent de :</p></div>
    <ul class="action-list"><li>contribuer à la prévention des risques professionnels dans l'entreprise ;</li><li>intervenir face à une situation d'accident du travail.</li></ul>
    <div class="body-text"><p>Votre action s'inscrit dans la démarche de prévention menée par votre employeur ainsi que dans le cadre de l'organisation des secours de l'entreprise.</p></div>
    <div class="note">Pour conserver la validité de votre certificat, il est nécessaire de suivre une formation « Maintien et actualisation des compétences » tous les 24 mois.</div>
    <div class="body-text" style="margin-top:20px;font-size:12.5px;color:var(--text-muted)">
      <p>Institut national de recherche et de sécurité pour la prévention des accidents du travail et des maladies professionnelles (INRS)<br>
      65, boulevard Richard-Lenoir, 75011 Paris — 01 40 44 30 00 — info@inrs.fr</p>
      <p>Édition INRS ED 4085 — 6ᵉ édition (2024), révisée en mars 2026.</p>
    </div>
  </main>`;
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
if (!location.hash) render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
